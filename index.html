<!DOCTYPE html>
    <html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Float Calculator</title>
        <link rel="stylesheet" href="styles.css">
        <link rel="stylesheet" href="https://fonts.googleapis.com/css?family=Roboto:400,500,600,700">
        <script src="scripts.js" defer></script>
    </head>
    <body>
        <div class="container">
            <h1>Float Calculator</h1>
            <output id="running_total" class="running-total">$0.00 (0.00)</output>
            <hr>
            <input type="number" inputmode="numeric" pattern="[0-9]*" id="target_float" class="float-total" data-value="0" min="0" step="1" placeholder="Target Float" aria-label="Target Float">
            <hr>
            <form id="calculator_form" class="calculator-form">
                
                <label for="input_100">$100 x</label>
                <input type="number" inputmode="numeric" pattern="[0-9]*" id="input_100" class="float-input" data-value="100" min="0" step="1" placeholder="0" enterkeyhint="next">
                <span id="subtotal_100">$0.00</span>
                <label for="input_50">$50 x</label>
                <input type="number" inputmode="numeric" pattern="[0-9]*" id="input_50" class="float-input" data-value="50" min="0" step="1" placeholder="0" enterkeyhint="next">
                <span id="subtotal_50">$0.00</span>
                <label for="input_20">$20 x</label>
                <input type="number" inputmode="numeric" pattern="[0-9]*" id="input_20" class="float-input" data-value="20" min="0" step="1" placeholder="0" enterkeyhint="next">
                <span id="subtotal_20">$0.00</span>
                <label for="input_10">$10 x</label>
                <input type="number" inputmode="numeric" pattern="[0-9]*" id="input_10" class="float-input" data-value="10" min="0" step="1" placeholder="0" enterkeyhint="next">
                <span id="subtotal_10">$0.00</span>
                <label for="input_5">$5 x</label>
                <input type="number" inputmode="numeric" pattern="[0-9]*" id="input_5" class="float-input" data-value="5" min="0" step="1" placeholder="0" enterkeyhint="next">
                <span id="subtotal_5">$0.00</span>
                <label for="input_2">$2 x</label>
                <input type="number" inputmode="numeric" pattern="[0-9]*" id="input_2" class="float-input" data-value="2" min="0" step="1" placeholder="0" enterkeyhint="next">
                <span id="subtotal_2">$0.00</span>
                <label for="input_1">$1 x</label>
                <input type="number" inputmode="numeric" pattern="[0-9]*" id="input_1" class="float-input" data-value="1" min="0" step="1" placeholder="0" enterkeyhint="next">
                <span id="subtotal_1">$0.00</span>
                <label for="input_50c">$0.50 x</label>
                <input type="number" inputmode="numeric" pattern="[0-9]*" id="input_50c" class="float-input" data-value="0.50" min="0" step="1" placeholder="0" enterkeyhint="next">
                <span id="subtotal_50c">$0.00</span>
                <label for="input_20c">$0.20 x</label>
                <input type="number" inputmode="numeric" pattern="[0-9]*" id="input_20c" class="float-input" data-value="0.20" min="0" step="1" placeholder="0" enterkeyhint="next">
                <span id="subtotal_20c">$0.00</span>
                <label for="input_10c">$0.10 x</label>
                <input type="number" inputmode="numeric" pattern="[0-9]*" id="input_10c" class="float-input" data-value="0.10" min="0" step="1" placeholder="0" enterkeyhint="next">
                <span id="subtotal_10c">$0.00</span>
            </form>

            <button type="button" id="reset_button" class="reset-button">Reset</button>
        </div>
    </body>
</html>
